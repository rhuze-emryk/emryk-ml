name: Build AMD64 QCOW2

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant
        required: true
        default: nvidia
        type: choice
        options:
          - nvidia
          - intel
      source-tag:
        description: Optional source tag (resolved to a digest before build)
        required: false
        default: latest
        type: string
      upload-to-s3:
        description: Upload the resulting QCOW2 to the configured S3 bucket
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - disk_config/disk.toml
      - .github/workflows/build-disk.yml

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_BASENAME: ${{ github.event.repository.name }}
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AMD64 QCOW2 (${{ inputs.variant || 'nvidia' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master as of 2025-10-10
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record artifact owner
        id: owner
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Resolve selected source image to a digest
        id: source
        env:
          SELECTED_VARIANT: ${{ inputs.variant || 'nvidia' }}
          SELECTED_TAG: ${{ inputs.source-tag || 'latest' }}
        run: |
          set -euo pipefail
          registry=${IMAGE_REGISTRY,,}
          basename=${IMAGE_BASENAME,,}
          suffix=''
          if [[ $SELECTED_VARIANT == intel ]]; then
            suffix='-intel'
          elif [[ $SELECTED_VARIANT != nvidia ]]; then
            echo "::error::Unsupported variant: $SELECTED_VARIANT"
            exit 1
          fi
          image="${registry}/${basename}${suffix}"
          digest=$(skopeo inspect --format '{{.Digest}}' \
            "docker://${image}:${SELECTED_TAG}")
          [[ $digest == sha256:* ]] || {
            echo '::error::Registry did not return a sha256 digest.'
            exit 1
          }
          echo "image=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${image}:${SELECTED_TAG} to ${image}@${digest}"

      - name: Build QCOW2
        id: build
        uses: osbuild/bootc-image-builder-action@31d72f795564fb09943f0705025e75748da3a2d1 # main as of 2026-05-04
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: disk_config/disk.toml
          image: ${{ steps.source.outputs.image }}
          chown: ${{ steps.owner.outputs.uid }}:${{ steps.owner.outputs.gid }}
          types: qcow2
          additional-args: --use-librepo=True --rootfs btrfs

      - name: Attest disk image build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.build.outputs.output-directory }}/*

      - name: Upload QCOW2 artifact
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emryk-${{ inputs.variant || 'nvidia' }}-amd64-qcow2
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload QCOW2 to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
          DESTINATION: S3:${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "$SOURCE_DIR" "$DESTINATION"
