---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, not nightly — and this scheduled run is the ONLY routine publish.
    # Pushes to main build-and-test but do NOT publish (the sign-and-publish
    # job below only runs on the publishing paths): the registry moves only on
    # this Monday cron or a manual workflow_dispatch. That gives the maintainer
    # one predictable approval per week instead of one per merge.
    #
    # The base is digest-pinned, so a scheduled rebuild only refreshes the ~20
    # dnf-layered packages — kernel/userland/driver arrive via Renovate digest
    # bumps (auto-merged to main during the week, then shipped by the next run
    # of this cron). Monday aligns with vendor-drift-watch; fire
    # workflow_dispatch for an urgent fix that can't wait for Monday.
    # See UPDATING.md.
    - cron: '05 10 * * MON'  # 10:05 UTC Mondays
  push:
    branches:
      - main
    # Mirrors NONIMAGE_RE in the "Detect image-relevant changes" step below —
    # keep the two lists in sync. Pushes to main run a build to validate that
    # main stays buildable, but they no longer publish; this list keeps a
    # docs/CI-config-only merge from spending ~8 min on a build that can't
    # change the image anyway.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.docs/**'
      - '.claude/**'
      - 'disk_config/**'
      - 'renovate.json'
      - '.github/renovate.json5'
      - '.github/workflows/renovate-notify.yml'
      - '.github/workflows/vendor-drift-watch.yml'
      - '.github/workflows/monday-cockpit.yml'
      - '.github/workflows/build-disk.yml'
      - 'LICENSE'
      - 'Justfile'
      - 'artifacthub-repo.yml'
      - '.gitignore'
  workflow_dispatch:

env:
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  # Base image name; each matrix leg appends its variant suffix ("" for the
  # NVIDIA image, "-intel" for the laptop/iGPU variant) in Prepare environment.
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  # Pinned for reproducibility; bumped by Renovate.
  GRYPE_VERSION: "v0.117.0"
  SYFT_VERSION: "v1.51.0"

concurrency:
  # Suffix the group with whether this run publishes (schedule/dispatch) so
  # publishing runs and non-publishing build runs never share a group. Without
  # this, a push to main during the weekly publish — or while its publish job
  # waits at the production-signing approval gate — would land in the same
  # group and CANCEL the publish (cancel-in-progress), so the week's release
  # could silently vanish just as you go to approve it. PR runs stay isolated
  # by their own ref.
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

# Three stages, split so the production-signing approval is informed. Before
# the split, the environment gate sat on the single build job, which paused the
# run before step one: the maintainer approved a publish having seen no build
# and no scan. Now build_scan stages exact digests, boot_smoke boots both of
# them in parallel as an advisory health check (SECURITY-TODO.md P2), and only
# publish carries the environment gate. Approval therefore means "sign and
# promote these exact, already-scanned digests".
jobs:
  build_scan:
    # These job names are the required status checks in branch protection
    # (UPDATING.md §6) — one per matrix leg, "Build and scan image (nvidia)"
    # and "Build and scan image (intel)". Rename them together or PRs can
    # never merge.
    name: Build and scan image (${{ matrix.variant }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      # One leg per published image. `variant` doubles as the Containerfile
      # --target; digest/tags/SBOM are handed to the publish job via
      # per-variant artifacts because matrix job *outputs* are
      # last-writer-wins — two legs sharing an `outputs:` block would
      # silently cross-wire their digests.
      matrix:
        include:
          - variant: nvidia
            image-suffix: ""
            desc: "Managed Fedora Kinoite bootc image for cloud ML workstations. NVIDIA open drivers, KDE Plasma, Tailscale, Cockpit, Podman/distrobox."
            keywords: "bootc,ublue,kinoite,nvidia,machine-learning,fedora,kde,cloud-workstation"
          - variant: intel
            image-suffix: "-intel"
            desc: "Managed Fedora Kinoite bootc image for Intel iGPU laptops/workstations. Same hardened payload as emryk-ml without the NVIDIA driver stack. KDE Plasma, Tailscale, Cockpit, Podman/distrobox."
            keywords: "bootc,ublue,kinoite,intel,laptop,machine-learning,fedora,kde,workstation"

    permissions:
      contents: read
      # Staging push on the publishing paths only; PR and push-to-main runs
      # never login (see the step `if:` guards below).
      packages: write

    outputs:
      # `publish` is identical across matrix legs, so last-writer-wins is
      # harmless here. Everything per-variant travels by artifact instead.
      publish: ${{ steps.pub.outputs.publish }}

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri and append the variant suffix
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME,,}${{ matrix.image-suffix }}" >> "$GITHUB_ENV"

      # Single source of truth for "does this run publish?": the Monday
      # schedule and manual workflow_dispatch on the default branch only.
      # Pull requests and ordinary pushes to main build-and-test but never
      # publish, so a merge never moves the registry on its own — the weekly
      # run (or an explicit "Run workflow") does. The ref check stops a
      # dispatch on a non-default branch from publishing.
      - name: Determine publish path
        id: pub
        run: |
          echo "publish=${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}" >> "$GITHUB_OUTPUT"

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Skip the ~8-minute image build on PRs that only touch docs / CI-config —
      # none of the files matched below can change the built image. The job
      # itself still runs and reports the required "Build and scan image" check
      # (green), so branch protection + Renovate auto-merge keep working; only
      # the heavy steps are skipped. Fail-open: any path NOT listed forces a
      # full build. Pushes to main, schedules and manual runs always build;
      # only the scheduled and manual runs go on to publish. NONIMAGE_RE must
      # stay in sync with the push paths-ignore list at the top of this file.
      - name: Detect image-relevant changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          NONIMAGE_RE: '(\.md$|^docs/|^\.docs/|^\.claude/|^disk_config/|^renovate\.json$|^\.github/renovate\.json5$|^\.github/workflows/(renovate-notify|vendor-drift-watch|monday-cockpit|build-disk)\.yml$|^LICENSE$|^Justfile$|^artifacthub-repo\.yml$|^\.gitignore$)'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Event '${{ github.event_name }}' -> full build."
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | sed '/^$/d')
          if [ -z "$files" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "No changed files reported -> building (fail-open)."
            exit 0
          fi
          echo 'Changed files:'
          while IFS= read -r file; do
            printf '  %s\n' "$file"
          done <<<"$files"
          if printf '%s\n' "$files" | grep -qvE "$NONIMAGE_RE"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "-> image-relevant change detected; building."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "-> only docs / CI-config changed; skipping the image build."
          fi

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          find build_files scripts tests -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          find build_files scripts tests -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        if: steps.changes.outputs.build == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master as of 2025-10-10 (post-v9, untagged)

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          # Repo URLs use the repository name, not IMAGE_NAME — the two
          # diverge on suffixed variants (emryk-ml-intel is not a repo).
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ matrix.desc }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ matrix.keywords }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        if: steps.changes.outputs.build == 'true'
        uses: redhat-actions/buildah-build@061ffd31bb5c3f8733a6f9bbdf00a9fb02eb708c # main as of 2026-04-09 (Node 24)
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
          # Both variants live in one Containerfile as named stages; the
          # matrix variant selects which one this leg builds.
          extra-args: |
            --target=${{ matrix.variant }}

      # The akmods-nvidia-open base ships kernel modules PRE-BUILT for one
      # specific kernel, encoded in its tag (…:main-44-<kver>…). kinoite-main
      # rolls its kernel forward independently, and Renovate's pinDigests can
      # only bump the akmods *digest* — never the <kver> in the tag string. So
      # a base bump can silently pair a new kernel with old modules: the build
      # still succeeds but the host boots to a black screen because the NVIDIA
      # modules don't match the running kernel. Catch that desync here, on the
      # PR, instead of at a customer's boot.
      - name: Verify NVIDIA akmods kernel matches base kernel
        # nvidia leg only: the intel variant ships no out-of-tree kmods, so
        # there is no kernel/module coupling to verify.
        if: steps.changes.outputs.build == 'true' && matrix.variant == 'nvidia'
        run: |
          set -euo pipefail
          # Kernel baked into the akmods-nvidia-open tag in Containerfile,
          # e.g. main-44-7.0.4-200.fc44.x86_64 -> 7.0.4-200.fc44.x86_64
          akmods_kver=$(grep -oP 'akmods-nvidia-open:main-[0-9]+-\K[^@[:space:]]+' Containerfile || true)
          if [ -z "$akmods_kver" ]; then
            echo "::error::Could not parse the akmods-nvidia-open kernel from Containerfile — has the FROM line format changed?"
            exit 1
          fi
          # Actual kernel the built image runs. We never replace the kernel,
          # so this is exactly what the pinned kinoite-main base ships. Query
          # rpm inside the image so the ubuntu runner needs no rpm of its own.
          ctr=$(buildah from "localhost/${IMAGE_NAME}:${DEFAULT_TAG}")
          image_kver=$(buildah run "$ctr" rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | tail -1)
          buildah rm "$ctr" >/dev/null
          echo "akmods tag kernel : ${akmods_kver}"
          echo "base image kernel : ${image_kver}"
          if [ "$akmods_kver" != "$image_kver" ]; then
            echo "::error::kinoite-main now ships kernel ${image_kver} but the akmods-nvidia-open tag in Containerfile is pinned to ${akmods_kver}. The prebuilt NVIDIA modules won't match the running kernel (black screen on boot). Bump the akmods tag to main-44-${image_kver} and let Renovate re-pin its digest."
            exit 1
          fi
          echo "✓ NVIDIA akmods kernel matches base image kernel (${image_kver})"

      - name: Verify variant payload boundary and layered configuration
        if: steps.changes.outputs.build == 'true'
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          container=$(buildah from "localhost/${IMAGE_NAME}:${DEFAULT_TAG}")
          cleanup() {
            buildah rm "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Fedora generates host keys on first boot, so an unbooted image
          # correctly has none. Give sshd an ephemeral key in this disposable
          # validation container so -T can reach and parse the shipped config.
          buildah run "$container" -- ssh-keygen -q -t ed25519 -N '' \
            -f /tmp/emryk-ci-hostkey
          buildah run "$container" -- sshd -T \
            -h /tmp/emryk-ci-hostkey >/dev/null
          buildah run "$container" -- jq empty /etc/containers/policy.json
          buildah run "$container" -- systemd-analyze verify \
            /etc/systemd/system/emryk-install-flatpaks.service \
            /etc/systemd/system/emryk-update-nudge.service \
            /etc/systemd/system/emryk-update-nudge.timer

          # A Buildah container shares the Ubuntu runner's running kernel.
          # Query the Fedora kernel installed in the image and direct modinfo
          # to that module tree instead of implicitly using `uname -r`.
          image_kver=$(buildah run "$container" -- rpm -q \
            --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core \
            | tail -1)
          [[ -n $image_kver ]]

          if [[ $VARIANT == nvidia ]]; then
            buildah run "$container" -- test -f \
              /usr/lib/modprobe.d/blacklist-nouveau.conf
            buildah run "$container" -- rpm -q nvidia-container-toolkit
            buildah run "$container" -- modinfo -k "$image_kver" nvidia \
              >/dev/null
          else
            if buildah run "$container" -- test -e \
              /usr/lib/modprobe.d/blacklist-nouveau.conf; then
              echo '::error::Intel image contains the nouveau blacklist.'
              exit 1
            fi
            if buildah run "$container" -- rpm -q nvidia-container-toolkit; then
              echo '::error::Intel image contains NVIDIA Container Toolkit.'
              exit 1
            fi
            if buildah run "$container" -- modinfo -k "$image_kver" nvidia \
              >/dev/null 2>&1; then
              echo '::error::Intel image contains NVIDIA module metadata.'
              exit 1
            fi
          fi

      # Extract just the RPM database from the built image
      # so syft can catalog it in seconds, instead of walking the full multi-GB
      # bootc rootfs (which exhausts free GHA runners). Coverage is
      # near-100% because build.sh installs every third-party payload via
      # dnf — no curl|tar of vendor binaries. The
      # tradeoff is documented in SECURITY.md.
      - name: Extract RPM database from built image
        if: steps.changes.outputs.build == 'true'
        run: |
          # buildah unshare enters a user namespace so rootless mount works.
          # On this image /usr/lib/sysimage/rpm is a symlink to ../../share/rpm,
          # so `cp -RL` dereferences it to copy the actual rpmdb.sqlite (~115MB)
          # into the path layout syft expects. Without -L the copy would be a
          # ~16-byte symlink and syft would find zero packages.
          # shellcheck disable=SC2016
          buildah unshare bash -ec '
            ctr=$(buildah from "localhost/${IMAGE_NAME}:${DEFAULT_TAG}")
            root=$(buildah mount "$ctr")
            mkdir -p ./sbom-input/usr/lib/sysimage/rpm ./sbom-input/etc
            cp -RL "$root/usr/lib/sysimage/rpm/." ./sbom-input/usr/lib/sysimage/rpm/
            # Also stage os-release so Syft records the distro.
            # Without it the SBOM has no distro and grype matches ZERO Fedora
            # packages — the CVE scan (and any customer who grypes the published
            # SBOM) silently reports clean. cp -L dereferences the /etc symlink.
            cp -L "$root/usr/lib/os-release" ./sbom-input/usr/lib/os-release
            cp -L "$root/usr/lib/os-release" ./sbom-input/etc/os-release
            buildah umount "$ctr"
            buildah rm "$ctr"
          '
          du -sh ./sbom-input
          # Sanity check: a real Fedora RPM DB is tens of MB. < 10MB means the
          # extract silently degraded (symlink not dereferenced, wrong path, etc).
          size_kb=$(du -sk ./sbom-input | cut -f1)
          if [ "$size_kb" -lt 10000 ]; then
            echo "::error::sbom-input is only ${size_kb}KB — RPM DB extract failed."
            exit 1
          fi
          # os-release must be staged and Fedora, or the scan
          # goes vacuous (grype can't map RPMs to the fedora namespace).
          if ! grep -q '^ID=fedora' ./sbom-input/usr/lib/os-release; then
            echo "::error::sbom-input os-release missing or not Fedora — grype would match nothing."
            exit 1
          fi

      - name: Install Syft
        if: steps.changes.outputs.build == 'true'
        run: |
          curl -fsSL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin syft
          syft version

      # CycloneDX SBOM, generated from the extracted RPM
      # database directory. attest-sbom in the publish job binds this to the
      # pushed digest.
      - name: Generate SBOM (CycloneDX)
        if: steps.changes.outputs.build == 'true'
        run: |
          syft scan dir:./sbom-input -o cyclonedx-json=sbom.cdx.json
          # Guard against the vacuous-scan regression — the
          # SBOM must carry distro metadata or grype silently matches zero
          # Fedora packages and the CVE gate becomes a no-op that always passes.
          if ! grep -q 'syft:distro:' sbom.cdx.json; then
            echo "::error::SBOM has no distro metadata — grype would match nothing. Check os-release staging in the extract step."
            exit 1
          fi
          {
            echo "## SBOM"
            echo ""
            echo "Generated \`sbom.cdx.json\` ($(wc -c < sbom.cdx.json) bytes,"
            echo "$(jq -r '.components | length' sbom.cdx.json) components) from RPM database."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Grype
        if: steps.changes.outputs.build == 'true'
        run: |
          curl -fsSL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VERSION#v}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin grype
          grype version

      # CVE scan via the SBOM (no image re-catalog).
      # Policy (SECURITY.md): critical-severity findings BLOCK the build (and so
      # the publish, since the sign-and-publish job `needs:` this one);
      # high/medium/low are reported in the job summary. Accepted findings — e.g.
      # a fix already available upstream that the digest-pinned base hasn't
      # picked up yet — are waived in `.grype.yaml` (auto-loaded from the repo
      # root) with a reason + date, reviewed in PR like any other change.
      - name: Scan SBOM with Grype (criticals block)
        if: steps.changes.outputs.build == 'true'
        run: |
          # --fail-on critical sets a non-zero exit when a >= critical finding
          # is present and not waived. tee + captured rc so the full table still
          # lands in the job summary even when the gate fails the build.
          rc=0
          grype "sbom:./sbom.cdx.json" --output table --fail-on critical | tee grype-report.txt || rc=$?
          {
            echo "## Grype vulnerability scan — \`${IMAGE_NAME}:${DEFAULT_TAG}\`"
            echo ""
            echo '```'
            cat grype-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Grype found an unwaived critical-severity vulnerability — build blocked. Fix it (bump the base) or add a justified, dated waiver to .grype.yaml."
          fi
          exit "$rc"

      # Hand the SBOM to the publish job so the attestation binds the exact
      # bytes that were scanned above — no regeneration across the gate.
      - name: Upload SBOM for the publish job
        if: steps.pub.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.variant }}
          path: sbom.cdx.json
          retention-days: 7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.pub.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stage the image at :staging BEFORE the approval gate so the publish
      # job can promote it by digest without rebuilding (a same-repo tag copy
      # is a manifest-only operation; the ~12GB of blobs upload once, here).
      # :staging is deliberately unsigned and may briefly lead :latest — or
      # outlive a rejected publish. That is safe by design: customer machines
      # enforce cosign signatures for this whole namespace (containers-
      # policy.json), so an unsigned :staging cannot be
      # pulled by them, and because cosign signatures attach to the DIGEST,
      # the moment the publish job signs, the same manifest at :staging is
      # covered too. Inline buildah push (not redhat-actions/push-to-registry,
      # deprecated on Node 20 with no Node 24 update); credentials come from
      # docker/login-action above.
      - name: Push staging image
        id: staging
        if: steps.pub.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          buildah push --digestfile=./staging-digest.txt \
            "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:staging"
          digest=$(cat ./staging-digest.txt)
          # Digest + tags travel to the publish job as a per-variant artifact
          # (matrix job outputs are last-writer-wins across legs).
          printf '%s' "${TAGS}" > ./release-tags.txt
          echo "Staged ${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}"

      - name: Upload release metadata for the publish job
        if: steps.pub.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-meta-${{ matrix.variant }}
          path: |
            staging-digest.txt
            release-tags.txt
          retention-days: 7
          if-no-files-found: error

  # Publishing paths also boot both exact staged digests in a VM as an
  # advisory post-release health check. It runs in parallel with publish and
  # does not gate it (tech debt: SECURITY-TODO.md P2). GitHub-hosted runners
  # expose no /dev/kvm, so the smoke VM boots under QEMU software emulation
  # (slower boot); missing OVMF fails the check itself, not the release.
  boot_smoke:
    name: Boot staged image (${{ matrix.variant }})
    needs: build_scan
    if: needs.build_scan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nvidia
            image-suffix: ''
          - variant: intel
            image-suffix: '-intel'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # master as of 2025-10-10
        with:
          extra-squeeze: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download exact staged digest metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-meta-${{ matrix.variant }}

      - name: Prepare digest-qualified source and CI-only user
        env:
          IMAGE_SUFFIX: ${{ matrix.image-suffix }}
        run: |
          set -euo pipefail
          registry=${IMAGE_REGISTRY,,}
          image_name=${IMAGE_NAME,,}${IMAGE_SUFFIX}
          digest=$(cat staging-digest.txt)
          [[ $digest == sha256:* ]] || {
            echo '::error::Invalid staged digest.'
            exit 1
          }
          source_image="${registry}/${image_name}@${digest}"
          skopeo inspect "docker://${source_image}" >/dev/null
          echo "SOURCE_IMAGE=${source_image}" >> "$GITHUB_ENV"

          smoke_password=$(openssl rand -hex 24)
          echo "::add-mask::$smoke_password"
          echo "SMOKE_PASSWORD=$smoke_password" >> "$GITHUB_ENV"
          jq --arg password "$smoke_password" \
            '.customizations.user[0].password = $password' \
            tests/boot-smoke-config.json > /tmp/boot-smoke-config.json

      - name: Install VM runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y expect ovmf qemu-system-x86
          # GitHub-hosted runners have no /dev/kvm; boot-smoke.exp therefore
          # boots with QEMU software emulation (accel=tcg, -cpu max). Keeping
          # this gate on hosted runners avoids a self-hosted-runner dependency
          # while still booting the exact staged digests.
          [[ -r /usr/share/OVMF/OVMF_CODE_4M.fd \
            && -r /usr/share/OVMF/OVMF_VARS_4M.fd ]] || {
            echo '::error::Required OVMF 4M firmware is unavailable.'
            exit 1
          }

      - name: Record artifact owner
        id: owner
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Build ephemeral smoke QCOW2
        id: bib
        uses: osbuild/bootc-image-builder-action@31d72f795564fb09943f0705025e75748da3a2d1 # main as of 2026-05-04
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
          config-file: /tmp/boot-smoke-config.json
          image: ${{ env.SOURCE_IMAGE }}
          chown: ${{ steps.owner.outputs.uid }}:${{ steps.owner.outputs.gid }}
          types: qcow2
          additional-args: --use-librepo=True --rootfs btrfs

      - name: Boot and assert staged image
        env:
          QCOW2_PATH: ${{ steps.bib.outputs.qcow2-output-path }}
          SMOKE_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          [[ -f $QCOW2_PATH ]] || {
            echo '::error::BIB did not produce the expected QCOW2.'
            exit 1
          }
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/OVMF_VARS_4M.fd
          : > /tmp/serial.log
          : > /tmp/journal-diagnostics.txt
          export SERIAL_LOG=/tmp/serial.log

          set +e
          expect tests/boot-smoke.exp \
            "$QCOW2_PATH" \
            /tmp/OVMF_VARS_4M.fd \
            "$SMOKE_PASSWORD" \
            "$SMOKE_VARIANT" \
            "$SOURCE_IMAGE"
          smoke_rc=$?
          set -e

          awk '/EMRYK_JOURNAL_BEGIN/{capture=1} capture {print} /EMRYK_JOURNAL_END/{capture=0}' \
            /tmp/serial.log > /tmp/journal-diagnostics.txt
          exit "$smoke_rc"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-smoke-diagnostics-${{ matrix.variant }}
          path: |
            /tmp/serial.log
            /tmp/journal-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

  # The publish path: sign -> verify -> promote -> attest, behind the production-signing
  # approval gate (required-reviewer, restricted to main) — KEY-POLICY.md
  # "GitHub Environment runbook". This job needs only build_scan: boot_smoke
  # runs in parallel and is advisory (SECURITY-TODO.md P2), so the approval
  # prompt appears once both exact digests have built and scanned. Signing
  # secrets are environment-scoped.
  publish:
    name: Sign and publish image (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    # Both matrix legs of the build/scan job must pass before the
    # production-signing approval can appear.
    needs: [build_scan]
    if: needs.build_scan.outputs.publish == 'true'
    environment: production-signing

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nvidia
            image-suffix: ""
          - variant: intel
            image-suffix: "-intel"

    permissions:
      contents: read
      packages: write
      id-token: write
      # Required for build provenance + SBOM attestations.
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri (same normalisation as build_scan)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME,,}${{ matrix.image-suffix }}" >> "$GITHUB_ENV"

      - name: Checkout expected active public key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The digest the maintainer approved is the one build_scan staged for
      # THIS variant — handed over as an artifact, never a matrix job output.
      - name: Download release metadata from build_scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-meta-${{ matrix.variant }}

      - name: Load release metadata
        run: |
          set -euo pipefail
          digest=$(cat staging-digest.txt)
          [[ $digest == sha256:* ]] || {
            echo '::error::No valid staged digest handed over from build_scan.'
            exit 1
          }
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "TAGS=$(cat release-tags.txt)" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v3.1.x removed the legacy-selection flag and auto-selects the
          # keyless attestation bundles instead of this image's key signature.
          # Keep v3.0.6 until that regression is fixed or policy is migrated.
          cosign-release: 'v3.0.6'

      - name: Sign immutable staged digest
        run: |
          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Verify signature with expected active key
        run: |
          set -euo pipefail
          cosign verify \
            --key cosign.pub \
            --new-bundle-format=false \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Manifest-only, same-repository copies happen only after the staged
      # digest's active-key signature has been verified. --preserve-digests
      # refuses any registry-side manifest rewrite.
      - name: Promote verified digest to release tags
        run: |
          set -euo pipefail
          image_full="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          read -r -a release_tags <<<"$TAGS"
          (( ${#release_tags[@]} > 0 )) || {
            echo '::error::No release tags were handed over.'
            exit 1
          }
          for tag in "${release_tags[@]}"; do
            skopeo copy --preserve-digests \
              "docker://${image_full}@${DIGEST}" \
              "docker://${image_full}:${tag}"
            echo "Promoted ${image_full}@${DIGEST} -> :${tag}"
          done

      - name: Download SBOM from build_scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ matrix.variant }}

      # Build provenance + CycloneDX SBOM attestations.
      # Both signed via Sigstore using the workflow's short-lived OIDC token
      # (no long-lived secret) and pushed as OCI referrers so a customer can
      # verify with `gh attestation verify` against the published artifact
      # alone — no GitHub API trust needed beyond the registry.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
