name: Vendored dependency drift watch

on:
  schedule:
    - cron: '0 13 * * SAT'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  tailscale:
    name: Check Tailscale repository and signing key
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPO_URL: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      KEY_URL: https://pkgs.tailscale.com/stable/fedora/repo.gpg
      EXPECTED_FINGERPRINT: 2596A99EAAB33821893C0A79458CA832957F5868

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare repository configuration
        id: repo
        run: |
          set -euo pipefail
          curl -fsSL "$REPO_URL" --output /tmp/tailscale.repo
          # The vendored copy deliberately points at the local key. Normalize
          # only that reviewed deviation before comparing every other byte.
          sed -i 's#^gpgkey=.*#gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-tailscale#' \
            /tmp/tailscale.repo
          if diff -u build_files/tailscale.repo /tmp/tailscale.repo \
            > /tmp/tailscale-repo.patch; then
            echo 'drifted=false' >> "$GITHUB_OUTPUT"
          else
            echo 'drifted=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Compare signing key
        id: key
        run: |
          set -euo pipefail
          curl -fsSL "$KEY_URL" --output /tmp/tailscale-repo.gpg
          expected_hash=$(awk '!/^#/ && NF >= 2 {print $1; exit}' \
            build_files/tailscale-repo.gpg.sha256)
          actual_hash=$(sha256sum /tmp/tailscale-repo.gpg | awk '{print $1}')
          actual_fingerprint=$(gpg --batch --show-keys --with-colons \
            /tmp/tailscale-repo.gpg | awk -F: '$1 == "fpr" {print $10; exit}')

          {
            echo "expected_hash=$expected_hash"
            echo "actual_hash=$actual_hash"
            echo "actual_fingerprint=$actual_fingerprint"
          } >> "$GITHUB_OUTPUT"

          if [[ $actual_hash == "$expected_hash" \
            && $actual_fingerprint == "$EXPECTED_FINGERPRINT" ]]; then
            echo 'drifted=false' >> "$GITHUB_OUTPUT"
          else
            echo 'drifted=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update repository drift issue
        if: steps.repo.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='Tailscale repository configuration drifted from upstream'
          {
            echo 'The upstream Tailscale Fedora repository configuration differs from the reviewed copy.'
            echo
            echo '```diff'
            cat /tmp/tailscale-repo.patch
            echo '```'
            echo
            echo 'Review the upstream change and update the vendored file in a pull request. Preserve the local file:// signing-key reference.'
          } > /tmp/repo-issue.md
          # Exact title match: GitHub issue search is fuzzy full-text.
          existing=$(gh issue list --state open --limit 300 --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t))[0].number // ""')
          if [[ -n $existing ]]; then
            gh issue edit "$existing" --body-file /tmp/repo-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/repo-issue.md
          fi

      - name: Open or update signing-key security review
        if: steps.key.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HASH: ${{ steps.key.outputs.expected_hash }}
          ACTUAL_HASH: ${{ steps.key.outputs.actual_hash }}
          ACTUAL_FINGERPRINT: ${{ steps.key.outputs.actual_fingerprint }}
        run: |
          set -euo pipefail
          title='SECURITY REVIEW: Tailscale repository signing key changed'
          {
            echo 'The upstream Tailscale Fedora signing key no longer matches the reviewed key material.'
            echo
            echo "- expected SHA-256: \`$EXPECTED_HASH\`"
            echo "- observed SHA-256: \`$ACTUAL_HASH\`"
            echo "- expected primary fingerprint: \`$EXPECTED_FINGERPRINT\`"
            echo "- observed primary fingerprint: \`$ACTUAL_FINGERPRINT\`"
            echo
            echo '**Do not update the key automatically.** Confirm the rotation through an independent Tailscale channel, review the new fingerprint, and land the new public key plus recorded hash in a security-reviewed pull request.'
          } > /tmp/key-issue.md
          # Exact title match: GitHub issue search is fuzzy full-text.
          existing=$(gh issue list --state open --limit 300 --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t))[0].number // ""')
          if [[ -n $existing ]]; then
            gh issue edit "$existing" --body-file /tmp/key-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/key-issue.md
          fi

  ublue-keys:
    name: Check Universal Blue image signing keys
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KEY_BASE_URL: https://raw.githubusercontent.com/ublue-os/packages/main/packages/ublue-os-signing/src/etc/pki/containers

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # build.yml verifies every ublue-os base digest against these vendored
      # keys (scripts/verify-upstream-base-signatures.sh). A change upstream is
      # either a rotation we must review or a compromise we must not follow.
      - name: Compare vendored keys with upstream
        id: keys
        run: |
          set -euo pipefail
          : > /tmp/ublue-keys.md
          drifted=false
          for key in ublue-os.pub ublue-os-backup.pub; do
            if ! curl -fsSL "$KEY_BASE_URL/$key" --output "/tmp/$key"; then
              echo "- \`$key\`: could not fetch upstream copy (moved or deleted?)" >> /tmp/ublue-keys.md
              drifted=true
            elif ! cmp -s "upstream-keys/$key" "/tmp/$key"; then
              {
                echo "- \`$key\` changed"
                echo "  - vendored SHA-256: \`$(sha256sum "upstream-keys/$key" | cut -d' ' -f1)\`"
                echo "  - upstream SHA-256: \`$(sha256sum "/tmp/$key" | cut -d' ' -f1)\`"
              } >> /tmp/ublue-keys.md
              drifted=true
            fi
          done
          echo "drifted=$drifted" >> "$GITHUB_OUTPUT"
          cat /tmp/ublue-keys.md

      - name: Open or update signing-key security review
        if: steps.keys.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title='SECURITY REVIEW: Universal Blue image signing key changed'
          {
            echo 'The Universal Blue cosign keys published upstream no longer match `upstream-keys/`, which `build.yml` uses to verify every `ghcr.io/ublue-os` base digest.'
            echo
            cat /tmp/ublue-keys.md
            echo
            echo "Source: ${KEY_BASE_URL}"
            echo
            echo '**Do not update the vendored keys automatically.** Confirm the rotation through an independent Universal Blue channel (announcement, the key in `ublue-os/main` `cosign.pub`, maintainers), then land the new key in a security-reviewed pull request. Until then, builds keep verifying against the old key and will fail once upstream signs only with the new one.'
          } > /tmp/ublue-key-issue.md
          # Exact title match: GitHub issue search is fuzzy full-text.
          existing=$(gh issue list --state open --limit 300 --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t))[0].number // ""')
          if [[ -n $existing ]]; then
            gh issue edit "$existing" --body-file /tmp/ublue-key-issue.md
          else
            gh issue create --title "$title" --body-file /tmp/ublue-key-issue.md
          fi
