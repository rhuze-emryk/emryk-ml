# Emryk: restrict ptrace to child processes (Fedora 45 default).
#
# build.sh removes yama-ptrace-enable, the package whose
# /usr/lib/sysctl.d/10-default-yama-scope.conf sets this back to 0. That is
# not enough on its own: the base image ships a PREBUILT initramfs that still
# contains a copy of that file, and the initrd's systemd-sysctl applies 0
# before the root filesystem is switched to. Nothing in the root re-applies
# the kernel default, so without this drop-in a booted system stays at 0
# (publish run 41381324265, 2026-11-02). The root filesystem's
# systemd-sysctl.service reads this file during early boot and sets 1.
#
# Administrators who need the old behaviour on one machine override this
# with a later-sorting file in /etc/sysctl.d/ (see README).
kernel.yama.ptrace_scope = 1
