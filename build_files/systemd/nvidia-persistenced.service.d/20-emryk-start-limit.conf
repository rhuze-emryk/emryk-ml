# Same purpose as nvidia-cdi-refresh.service.d/20-emryk-start-limit.conf.
# Upstream ships Restart=always with systemd's default limit of 5 starts per
# 10 s. Without a GPU the daemon fails to initialize about every 7 s under
# software emulation, so the default window never fills and the unit, which
# multi-user.target is implicitly After=, restarts forever.
[Unit]
StartLimitIntervalSec=120s
StartLimitBurst=5
