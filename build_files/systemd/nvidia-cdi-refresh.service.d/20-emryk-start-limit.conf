# Bound the restart loop on machines where the NVIDIA driver cannot bind
# (the release-gate QEMU VM, or hardware without an NVIDIA GPU).
#
# Upstream ships Restart=on-failure, RestartSec=1s and a start limit of 5
# attempts per 10 s. Each failed attempt (nvidia-smi probe + nvidia-ctk) takes
# ~3.7 s under software emulation, so five attempts span ~18 s and the 10 s
# window never fills: the unit restarts forever. multi-user.target is
# implicitly After= every unit it Wants (systemd.target(5)), so an endless
# restart loop keeps the target from ever becoming active. Seen on publish
# run 41075345766 (2026-10-30): 72 restarts in 5 min, boot smoke exit 3.
#
# Counting the same 5 attempts over 2 min trips the limit regardless of how
# slow one attempt is. On a GPU host the first attempt succeeds and this
# never engages; nvidia-cdi-refresh.path still re-triggers on driver or
# toolkit changes.
[Unit]
StartLimitIntervalSec=120s
StartLimitBurst=5
